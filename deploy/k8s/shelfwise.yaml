apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfwise
  labels:
    app: shelfwise
spec:
  replicas: 1 # SQLite allows one writer; see the book's Chapter 11
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelfwise
  template:
    metadata:
      labels:
        app: shelfwise
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelfwise
          image: ghcr.io/your-org/shelfwise:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: SHELFWISE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shelfwise
                  key: api-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shelfwise-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shelfwise
spec:
  selector:
    app: shelfwise
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfwise-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
