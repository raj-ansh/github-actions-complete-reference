# Chapter 19's "Action CI", adapted because the action lives in a subfolder
# of this repository instead of at the root of its own repository.
name: Action CI

on:
  push:
    branches: [main]
    paths: ["check-changelog-action/**", ".github/workflows/action-ci.yml"]
  pull_request:
    paths: ["check-changelog-action/**", ".github/workflows/action-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: check-changelog-action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: check-changelog-action/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that dist/ is up to date
        run: git diff --exit-code dist/
      - name: Create a sample changelog
        run: printf '## [1.2.0]\n' > sample.md
      - id: check
        uses: ./check-changelog-action
        with:
          version: 1.2.0
          file: check-changelog-action/sample.md
      - name: Show the matched heading
        env:
          HEADING: ${{ steps.check.outputs.heading }}
        run: echo "Matched $HEADING"
