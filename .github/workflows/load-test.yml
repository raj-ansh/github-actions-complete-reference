name: Load test

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: Base URL of the staging service
        required: true
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        env:
          BASE_URL: ${{ inputs.base-url }}
        with:
          path: loadtest/smoke.js
