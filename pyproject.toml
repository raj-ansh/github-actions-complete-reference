[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfwise"
version = "1.0.0"
description = "A small inventory API for independent bookshops."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16,<3",
  "hypothesis>=6.170,<7",
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shelfwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["shelfwise"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
