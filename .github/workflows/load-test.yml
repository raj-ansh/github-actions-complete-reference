name: Load test

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: Base URL of the staging service
        required: true
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      - uses: grafana/run-k6-action@54385d2a25c222a08b4a3aec6b653b8fb370a1ed # v1.6.0
        env:
          BASE_URL: ${{ inputs.base-url }}
        with:
          path: loadtest/smoke.js
